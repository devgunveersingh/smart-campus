<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - Smart Campus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <span class="brand">Smart Campus</span>
    <div>
      <span class="welcome">Hi, <span id="userName"></span></span>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>

  <h1>Dashboard</h1>
  <div class="card-grid">
    <a class="card" href="announcements.html">
      <h2>📢 Announcements</h2>
      <p>See the latest campus notices.</p>
    </a>
    <a class="card" href="lostfound.html">
      <h2>🎒 Lost &amp; Found</h2>
      <p>Report or browse lost items.</p>
    </a>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem("user"));

    if (!user) {
      window.location.href = "login.html";
    } else {
      document.getElementById("userName").textContent = user.name;
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("user");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
